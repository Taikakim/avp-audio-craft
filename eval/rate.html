<!doctype html><html><head><meta charset=utf-8>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Rate</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:#0f0f13;color:#cde;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 display:flex;flex-direction:column;min-height:100vh;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
 user-select:none;touch-action:manipulation}
select,button{font:inherit;color:inherit}
#hdr{display:flex;gap:8px;padding:10px 10px 6px;align-items:center}
#lensel{flex:0 0 auto;background:#1a1a22;border:1px solid #333844;border-radius:8px;color:#9ab;
 padding:8px 10px;font-size:13px;min-height:40px}
#playpause{flex:0 0 auto;width:52px;height:52px;border-radius:12px;border:2px solid #3a3d48;
 background:#181820;color:#9ab;font-size:22px;display:flex;align-items:center;justify-content:center}
#playpause.paused{border-color:#fa5;background:#2a2013;color:#fc9}
#qdisplay{padding:6px 14px 2px;text-align:center}
#qprogress{color:#678;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
#qtext{color:#cde;font-size:16px;line-height:1.35;margin-top:2px;min-height:44px}
#abrow{display:flex;gap:8px;padding:8px 10px 4px}
.abbtn{flex:1;min-height:76px;border-radius:14px;border:2px solid #3a3d48;background:#181820;
 color:#9ab;font-size:26px;font-weight:700;letter-spacing:.05em}
.abbtn.chosen{border-color:#5d9;background:#173322;color:#8f8}
.abbtn-even{font-size:16px;letter-spacing:.03em;color:#89a}
#status{text-align:center;color:#789;font-size:12px;min-height:16px;padding:2px 0}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:10px}
.rate-row{display:flex;gap:8px;justify-content:center;width:100%;max-width:420px;transition:opacity .15s}
.rate-row.inactive{opacity:.28}
.rate-btn{flex:1 1 0;max-width:60px;aspect-ratio:1;border-radius:50%;border:2px solid #3a3d48;background:#181820;
 color:#9ab;font-size:22px;font-weight:600}
.rate-btn:disabled{cursor:default}
.rate-btn.chosen{border-color:#5b9dd9;background:#132a3a;color:#9cf}
.rate-btn.broken{border-color:#a44;color:#f77}
.rate-btn.broken.chosen{border-color:#e55;background:#3a1414;color:#faa}
#center{width:150px;height:150px;border-radius:50%;border:3px solid #445;background:radial-gradient(circle at 35% 30%,#2a2a36,#161620);
 display:flex;align-items:center;justify-content:center;position:relative;touch-action:none}
#center.scrubbing{border-color:#fa5}
#nowplaying{position:absolute;top:-26px;color:#789;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
#glyph{font-size:44px;color:#9ab;pointer-events:none}
#bar{width:120px;height:4px;background:#2a2a34;border-radius:2px;position:absolute;bottom:20px;overflow:hidden}
#fill{height:100%;background:#5b9dd9;width:0%}
#hint{color:#556;font-size:11.5px;text-align:center;max-width:280px;line-height:1.5}
#overlay{position:fixed;inset:0;background:#0f0f13;display:flex;align-items:center;justify-content:center;z-index:10}
#startbtn{min-height:64px;padding:0 32px;border-radius:14px;border:2px solid #5d9;background:#173322;color:#9f9;font-size:20px;font-weight:600}
#startbtn:disabled{opacity:.4;border-color:#445;background:#181820;color:#789}
</style></head><body>

<div id="overlay"><button id="startbtn" disabled>loading…</button></div>

<div id="hdr">
 <select id="lensel"><option>loading…</option></select>
 <button id="playpause" title="pause / resume">&#9208;</button>
</div>
<div id="qdisplay">
 <div id="qprogress"></div>
 <div id="qtext"></div>
</div>
<div id="abrow">
 <button class="abbtn" id="btnA">A</button>
 <button class="abbtn abbtn-even" id="btnEven">EVEN</button>
 <button class="abbtn" id="btnB">B</button>
</div>
<div id="status"></div>

<div id="stage">
 <div class="rate-row" id="rowA"></div>
 <div id="center">
  <div id="nowplaying">A</div>
  <div id="glyph">&#9654;</div>
  <div id="bar"><div id="fill"></div></div>
 </div>
 <div class="rate-row" id="rowB"></div>
 <div id="hint">tap the circle to switch tracks (same moment, blind) &middot; hold + drag to scrub</div>
</div>

<script>
// ── DATA: same manifest dora_table.html / model_matrix.html already read ──────────────
const LENGTH_CLUSTERS=[24,48,95,190,380];
function lengthBucket(e){
 if((e.duration_mode||'std')!=='native') return {key:'std',label:'20s (grid)'};
 const d=parseFloat(e.duration||0);
 let best=LENGTH_CLUSTERS[0],bd=Infinity;
 for(const c of LENGTH_CLUSTERS){const diff=Math.abs(d-c);if(diff<bd){bd=diff;best=c;}}
 return {key:'nat'+best,label:'~'+best+'s (native)'};
}
// PTM clips are only ever rendered at cfg1/w1 (Kim 2026-08-14: "obviously for post-trained
// clips they will be silently falling back to a CFG of one") -- so eligibility is per-model:
// the global cfg7/w1 for ordinary rows, cfg1/w1 for the model's own _ptm siblings. Both sides
// still land in the SAME (prompt,length) pool, so a base row and its _ptm sibling can be
// paired against each other exactly like any other two rows.
function eligible(e){
 const isPtm=String(e.model||'').endsWith('_ptm');
 const cfg=parseFloat(e.cfg),w=parseFloat(e.strength);
 return isPtm?(cfg===1&&w===1):(cfg===7&&w===1);
}
// SCORED gate (Kim 2026-08-15, "the polluted models can be removed from the rating"):
// manifest_live.jsonl lists every clip that was ever RENDERED, with no regard for whether
// it passed the latent-sanity gate -- 3 dronesweep models with blown-up latents (a Muon
// spectral weight-decay bug, 0.01 instead of 0.1) were rateable in a blind A/B right
// alongside real audio before this fix. scored_models.json is the same aggregate
// build_clap_hyperparam_table.py writes clap_dora_aggregate.csv from -- a model only
// appears in it once it has an aggregate row, i.e. passed the cfg7/w1 sanity gate and got
// scored. FAIL CLOSED: if the fetch fails, SCORED stays empty and nothing pools rather
// than silently falling back to the unfiltered (unsafe) behaviour.
let SCORED=new Set();
let pools={};   // lengthKey -> {label, byPrompt:{pid: Map('model|ckpt' -> entry)}}
async function loadManifest(){
 try{
  const sr=await fetch('model_matrix/scored_models.json',{cache:'no-store'});
  SCORED=new Set(await sr.json());
 }catch(_){SCORED=new Set();}
 const r=await fetch('model_matrix/manifest_live.jsonl',{cache:'no-store'});
 const txt=await r.text();
 const out={};
 for(const ln of txt.split('\n')){
  if(!ln.trim())continue;
  let e;try{e=JSON.parse(ln);}catch(_){continue;}
  if(!eligible(e))continue;
  if(!SCORED.has(e.model))continue;
  const pid=String(e.prompt_id);
  const {key,label}=lengthBucket(e);
  out[key]=out[key]||{label,byPrompt:{}};
  out[key].byPrompt[pid]=out[key].byPrompt[pid]||new Map();
  out[key].byPrompt[pid].set(e.model+'|'+e.ckpt,
   {model:e.model,ckpt:e.ckpt,cfg:parseFloat(e.cfg),w:parseFloat(e.strength),file:e.file});
 }
 pools=out;
}
function bucketHasPairs(b){return Object.values(b.byPrompt).some(m=>m.size>=2);}
function pickPair(bucket){
 const cands=Object.entries(bucket.byPrompt).filter(([,m])=>m.size>=2);
 if(!cands.length)return null;
 const [pid,m]=cands[Math.floor(Math.random()*cands.length)];
 const arr=[...m.values()];
 let i=Math.floor(Math.random()*arr.length),j;
 do{j=Math.floor(Math.random()*arr.length);}while(j===i);
 const pair=[arr[i],arr[j]];
 if(Math.random()<0.5)pair.reverse();
 return {pid,a:pair[0],b:pair[1]};
}

// ── PLAYBACK: two preloaded elements for instant gapless A/B switching (the core repeated
// gesture here, unlike dora_table/model_matrix's occasional single-swap click) ────────────
const audioA=new Audio(),audioB=new Audio();
audioA.loop=true;audioB.loop=true;audioA.preload='auto';audioB.preload='auto';
let active='A';
function cur(){return active==='A'?audioA:audioB;}
function other(){return active==='A'?audioB:audioA;}
// Kim 2026-08-14: "there should be a way to stop playback" -- a dedicated button rather than
// overloading the center gesture further (a third hold-still-vs-hold-drag distinction would be
// easy to mis-trigger one-handed/while driving, which is exactly the context this page is for).
const ppBtn=document.getElementById('playpause');
let isPaused=false;
function setPaused(p){
 isPaused=p;
 if(isPaused){cur().pause();}
 else{const pr=cur().play();if(pr&&pr.catch)pr.catch(()=>{});}
 ppBtn.innerHTML=isPaused?'&#9654;':'&#9208;';
 ppBtn.classList.toggle('paused',isPaused);
}
ppBtn.onclick=()=>setPaused(!isPaused);
function setPairAudio(a,b){
 audioA.pause();audioB.pause();
 audioA.src='model_matrix/'+a.file;audioB.src='model_matrix/'+b.file;
 audioA.currentTime=0;audioB.currentTime=0;
 active='A';
 setPaused(false);   // a fresh pair always starts playing, regardless of the previous pair's state
}
// A deliberate tap always means "let me hear the other one now" -- switching used to
// respect isPaused and silently reposition which track was "active" without resuming, so a
// tap while paused looked like nothing happened at all. Kim 2026-08-16: "if the sound is
// stopped, clicking on the triangle continues playback from where it was on the same clip"
// -- traced to gesture detection dropping the tap entirely (see endGesture below), and once
// that's fixed a tap-while-paused needs to actually resume on the NEW track, not stay silent.
function switchActive(){
 const c=cur(),n=other();
 n.currentTime=c.currentTime;
 c.pause();
 const pr=n.play();if(pr&&pr.catch)pr.catch(()=>{});
 isPaused=false;ppBtn.innerHTML='&#9208;';ppBtn.classList.remove('paused');
 active=active==='A'?'B':'A';
 updateUI();
}

// ── GESTURE: tap(<100ms, <12px movement) = switch; hold+drag = scrub ───────────────────
const centerEl=document.getElementById('center'),fillEl=document.getElementById('fill');
let pStart=null,pStartX=0,pStartT=0,scrubMode=false;
centerEl.addEventListener('pointerdown',e=>{
 pStart=performance.now();pStartX=e.clientX;scrubMode=false;
 pStartT=cur().currentTime;
 centerEl.setPointerCapture(e.pointerId);
});
centerEl.addEventListener('pointermove',e=>{
 if(pStart===null)return;
 const dx=e.clientX-pStartX,elapsed=performance.now()-pStart;
 // Kim 2026-08-16, after the tap-drop fix above made stray movement matter more: "the
 // scrubbing is activated immediately... because of the mouse moving at all, the clip is
 // not switched" -- was 120ms, raised to 200ms so a normal mouse click's incidental jitter
 // (much easier to rack up over more of the gesture than a phone tap ever sees) has more
 // room before it reads as a deliberate hold. NOTE the OTHER half of this OR, Math.abs(dx)>12,
 // still triggers scrub INSTANTLY regardless of elapsed if a click's movement alone exceeds
 // 12px -- if switches are still getting eaten by micro-drags, that's the number to raise next.
 if(!scrubMode&&(elapsed>200||Math.abs(dx)>12)){
  scrubMode=true;cur().pause();centerEl.classList.add('scrubbing');
 }
 if(scrubMode){
  const c=cur(),dur=c.duration||20;
  const dt=(dx/window.innerWidth)*dur;
  const nt=Math.max(0,Math.min(dur-0.05,pStartT+dt));
  audioA.currentTime=nt;audioB.currentTime=nt;
  fillEl.style.width=(100*nt/dur)+'%';
 }
});
// Kim 2026-08-16 ("at least on desktop the user has to click on the triangle to switch,
// it should be enough to just hit the circle or the triangle"): the old elapsed<100ms gate
// meant a click that took longer than 100ms to release -- trivially easy with a mouse, since
// there's no urgency the way a phone tap has -- fell into NEITHER branch (not a tap, since
// too slow; not a scrub, since scrubMode only ever becomes true via actual pointermove
// movement) and did nothing at all. Verified live: a 300ms stationary hold-and-release
// produced zero state change. scrubMode is already the real signal for "did the user drag" --
// it's set in pointermove the instant real movement/duration crosses the threshold WHILE
// MOVING, so a release with no movement at all is unambiguously a tap regardless of how long
// it was held. Dropping the elapsed/dx check here fixes it without weakening scrub detection.
function endGesture(e){
 if(pStart===null)return;
 if(!scrubMode){switchActive();}
 else{
  if(!isPaused){const pr=cur().play();if(pr&&pr.catch)pr.catch(()=>{});}   // stay paused if it was deliberate
  centerEl.classList.remove('scrubbing');
 }
 pStart=null;scrubMode=false;
}
centerEl.addEventListener('pointerup',endGesture);
centerEl.addEventListener('pointercancel',endGesture);
[audioA,audioB].forEach(a=>a.addEventListener('timeupdate',()=>{
 if(a!==cur()||scrubMode)return;
 const d=a.duration||0;if(d)fillEl.style.width=(100*a.currentTime/d)+'%';
}));

// ── RATINGS + A/B UI ─────────────────────────────────────────────────────────────────
const rowA=document.getElementById('rowA'),rowB=document.getElementById('rowB');
function buildRow(row,slot){
 // Kim 2026-08-15: a red 0 before 1 -- "so broken that it's not meaningful to rate" (a
 // technical-failure flag, not a real enjoyment score of zero). Still counts as "rated" for
 // maybeAdvance() -- rateSlot() below treats val generically, no separate code path needed.
 const zero=document.createElement('button');
 zero.className='rate-btn broken';zero.textContent='0';
 zero.title="so broken it isn't meaningful to rate";
 zero.onclick=()=>rateSlot(slot,0,zero);
 row.appendChild(zero);
 for(let i=1;i<=5;i++){
  const b=document.createElement('button');
  b.className='rate-btn';b.textContent=i;
  b.onclick=()=>rateSlot(slot,i,b);
  row.appendChild(b);
 }
}
buildRow(rowA,'A');buildRow(rowB,'B');
const btnA=document.getElementById('btnA'),btnB=document.getElementById('btnB'),btnEven=document.getElementById('btnEven');
const lensel=document.getElementById('lensel');
const npEl=document.getElementById('nowplaying'),statusEl=document.getElementById('status');
const qTextEl=document.getElementById('qtext'),qProgEl=document.getElementById('qprogress');

// Kim 2026-08-15: "obligatory to answer everything" -- cycle through all 5 questions per
// pair instead of picking one from a dropdown. Each answer is still one tap (still
// "immediate"), it just automatically advances to the next question rather than the next
// pair, so every pair now yields data on every dimension instead of whichever one the
// picker happened to be set to.
const QUESTIONS=[
 {id:'top_end',text:'more precise top end? (less harshness/noise)'},
 {id:'spectral_image',text:'more precise spectral image? (less noisy/glitchy)'},
 {id:'production',text:'overall better produced sound?'},
 {id:'structure',text:'more coherent structure? (flow of phrases/sections)'},
 {id:'interesting',text:'more interesting? (creative/unique)'},
];
let qIndex=0;
function showQuestion(){
 // Kim 2026-08-16: the bare "all questions answered" didn't tell the rater they still need
 // to score both clips (0-5) before the round advances -- maybeAdvance() gates on ratedA AND
 // ratedB in addition to the question cycle, so "answered" alone undersold what's left.
 if(qIndex>=QUESTIONS.length){qTextEl.textContent='All the questions have been answered. Rate the clips to proceed.';qProgEl.textContent='';return;}
 qTextEl.textContent=QUESTIONS[qIndex].text;
 qProgEl.textContent='question '+(qIndex+1)+' / '+QUESTIONS.length;
}

let curPid,curLenKey,curA,curB,roundState;
function resetRound(){
 roundState={ratedA:false,ratedB:false};
 qIndex=0;showQuestion();
 [...rowA.children,...rowB.children].forEach(b=>b.classList.remove('chosen'));
 btnA.classList.remove('chosen');btnEven.classList.remove('chosen');btnB.classList.remove('chosen');
}
function updateUI(){
 rowA.classList.toggle('inactive',active!=='A');
 rowB.classList.toggle('inactive',active!=='B');
 [...rowA.children].forEach(b=>b.disabled=active!=='A');
 [...rowB.children].forEach(b=>b.disabled=active!=='B');
 npEl.textContent=active;
}
const EP='/files/ratings.php';
// Kim 2026-08-15 (the question-cycle change): a round now fires up to 7 POSTs (2 enjoyment +
// 5 ab) instead of 3, in quick succession by design ("still immediate to answer"). Fired
// concurrently+fire-and-forget, some raced the server's per-IP rate limit and were silently
// dropped -- fetch() only rejects on network failure, never on a non-2xx status, so a 429
// response was indistinguishable from success to the old code. Serialize through one queue
// (guarantees no two requests race each other) and retry on failure/429 with backoff, so nothing
// gets lost regardless of how fast the taps come in.
let postQueue=Promise.resolve();
function post(body){postQueue=postQueue.then(()=>postOnce(body));}
async function postOnce(body,attempt){
 attempt=attempt||0;
 let r;
 try{r=await fetch(EP,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});}
 catch(e){r=null;}
 if((!r||!r.ok)&&attempt<6){
  await new Promise(res=>setTimeout(res,250));
  return postOnce(body,attempt+1);
 }
}
function rateSlot(slot,val,btn){
 const e=slot==='A'?curA:curB;
 const row=slot==='A'?rowA:rowB;
 [...row.children].forEach(b=>b.classList.remove('chosen'));
 btn.classList.add('chosen');
 roundState[slot==='A'?'ratedA':'ratedB']=true;
 post({type:'enjoyment',model:e.model,ckpt:e.ckpt,prompt_id:curPid,cfg:e.cfg,w:e.w,length:curLenKey,file:e.file,rating:val});
 maybeAdvance();
}
function chooseAB(choice,btn){
 if(qIndex>=QUESTIONS.length)return;   // already finished this pair's cycle -- ignore stray taps
 btnA.classList.remove('chosen');btnEven.classList.remove('chosen');btnB.classList.remove('chosen');
 btn.classList.add('chosen');
 const q=QUESTIONS[qIndex];
 post({type:'ab',question_id:q.id,prompt_id:curPid,length:curLenKey,
  model_a:curA.model,ckpt_a:curA.ckpt,cfg_a:curA.cfg,w_a:curA.w,file_a:curA.file,
  model_b:curB.model,ckpt_b:curB.ckpt,cfg_b:curB.cfg,w_b:curB.w,file_b:curB.file,choice});
 qIndex++;
 setTimeout(()=>{                       // brief flash of the chosen answer, then the next question
  btnA.classList.remove('chosen');btnEven.classList.remove('chosen');btnB.classList.remove('chosen');
  showQuestion();
  maybeAdvance();
 },220);
}
btnA.onclick=()=>chooseAB('A',btnA);
btnEven.onclick=()=>chooseAB('EVEN',btnEven);
btnB.onclick=()=>chooseAB('B',btnB);

// Kim 2026-08-14: no manual "next" control -- once both tracks are rated AND every question
// in the cycle is answered, load a fresh random pair automatically. Random sampling, so
// there is nothing meaningful for a "next" button to skip past.
function maybeAdvance(){
 if(roundState.ratedA&&roundState.ratedB&&qIndex>=QUESTIONS.length){
  statusEl.textContent='nice — next pair…';
  setTimeout(loadNewPair,550);
 }
}
function loadNewPair(){
 const bucket=pools[lensel.value];
 if(!bucket){statusEl.textContent='no data at this length';return;}
 const picked=pickPair(bucket);
 if(!picked){statusEl.textContent='no pairs available at this length yet';return;}
 curPid=picked.pid;curA=picked.a;curB=picked.b;curLenKey=lensel.value;
 resetRound();
 setPairAudio(curA,curB);
 updateUI();
 statusEl.textContent='';
}
lensel.onchange=loadNewPair;

function populateLengthSelect(){
 const keys=Object.keys(pools).filter(k=>bucketHasPairs(pools[k]));
 keys.sort((a,b)=>{if(a==='std')return -1;if(b==='std')return 1;return parseInt(a.slice(3))-parseInt(b.slice(3));});
 lensel.innerHTML='';
 for(const k of keys){const o=document.createElement('option');o.value=k;o.textContent=pools[k].label;lensel.appendChild(o);}
}

// ── INIT: manifest loads in the background; playback only ever starts from the real tap
// on #startbtn, so mobile autoplay policy is satisfied once, and the single persistent
// audioA/audioB elements stay "unlocked" for every subsequent programmatic play() after. ──
const startbtn=document.getElementById('startbtn'),overlay=document.getElementById('overlay');
loadManifest().then(()=>{
 populateLengthSelect();
 if(!lensel.options.length){startbtn.textContent='no eligible clips found';return;}
 startbtn.disabled=false;startbtn.textContent='tap to begin';
}).catch(()=>{startbtn.textContent='failed to load — reload the page';});
startbtn.onclick=()=>{overlay.style.display='none';loadNewPair();};
</script>
</body></html>
