<h1>Fixture page</h1>
<p>Training with <a class="gl" data-term="momentum" href="../help/glossary.html#momentum">momentum</a> smooths the
steps, and an <a class="gl" data-term="ema" href="../help/glossary.html#ema">EMA</a> smooths the weights.</p>
<div style="height: 900px" aria-hidden="true"></div>
<p>Later: <a class="gl" data-term="adamw" href="../help/glossary.html#adamw">AdamW</a>, then
<a class="gl" data-term="lora" href="../help/glossary.html#lora">LoRA</a>, then
<span class="gl gl-rep" data-term="momentum">Momentum</span> again, and a term the glossary
does not know: <a class="gl" data-term="not-in-glossary" href="../help/glossary.html#not-in-glossary">mystery</a>.</p>
<div style="height: 900px" aria-hidden="true"></div>
<p>The end of the fixture page.</p>
