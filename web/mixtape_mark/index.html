<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171a">
<title>Shortlist Mix Marker</title>
<!-- Page: GHOST-NOTE (Misc/mixtape_mark_page.template.html). Site version: WINTERMUTE 2026-10-28 -- audio from mix.mp4, cues from
     cues.json (a new mix replaces those two files only), marks POSTed to /files/ratings.php as type 'mixflag' (flag bad_track |
     bad_transition | unmark). Marks are write-only: the server never serves them back, so the list shows this visit's marks only.
     Rev 2 (G's direction for listening on a drive): two buttons filling the screen, haptic + full-screen flash on each press, screen
     kept awake (Wake Lock), playback position saved locally every 2 s and on hide, restored on reopen; lock-screen play/pause via
     the Media Session API. The saved position is a per-viewer convenience only; marks never depend on local storage. -->
<style>
:root{--bg:#14171a;--ink:#ecebe8;--mute:#9aa0a8;--card:#1d2226;--line:#33393f;--bad:#ff8a80;--badbg:#4a1f1c;--tr:#ffc46b;--trbg:#43340f;--acc:#7cc6d6}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f1ee;--ink:#1d2024;--mute:#5f646b;--card:#fff;--line:#d9d5cf;--bad:#9e1f18;--badbg:#fbe0dc;--tr:#7a4200;--trbg:#ffe9c2;--acc:#1f5d6b}}
:root[data-theme="light"]{--bg:#f3f1ee;--ink:#1d2024;--mute:#5f646b;--card:#fff;--line:#d9d5cf;--bad:#9e1f18;--badbg:#fbe0dc;--tr:#7a4200;--trbg:#ffe9c2;--acc:#1f5d6b}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:max(10px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));-webkit-user-select:none;user-select:none}
main{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:10px;min-height:100%}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h1{font-size:15px;margin:0;color:var(--mute);font-weight:600}
.now{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.id{font-size:12px;color:var(--mute);overflow-wrap:anywhere;min-height:16px}
audio{width:100%}
.big{flex:1;display:flex;flex-direction:column;gap:12px;min-height:62vh}
button.mark{flex:1;width:100%;font:inherit;font-size:30px;font-weight:800;line-height:1.15;border-radius:20px;border:3px solid;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
button.mark .ico{font-size:52px;line-height:1}
button.mark:active{transform:scale(.985)}
button.mark:focus-visible{outline:4px solid var(--acc);outline-offset:3px}
#bTrack{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
#bTrans{background:var(--trbg);color:var(--tr);border-color:var(--tr)}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .45s ease-out;z-index:9}
#flash.on{opacity:.85;transition:none}
#flash .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;color:#fff;text-align:center;padding:20px}
.status{font-size:13px;color:var(--mute);min-height:18px}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 12px}
summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:var(--mute);font-size:14px}
.row{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.row .w{flex:1;min-width:0}
.row .w small{display:block;color:var(--mute);overflow-wrap:anywhere}
.row button,.foot button{min-height:44px;min-width:44px;font:inherit;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:0 12px}
.foot{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0}
</style>
</head>
<body>
<main>
 <div class="top"><h1 id="sub">Shortlist mix · loading…</h1><div class="now" id="nowT">–</div></div>
 <div class="id" id="nowId"></div>
 <audio id="au" controls preload="auto" src="mix.mp4"></audio>
 <div class="status" id="st">Marks are saved on the server as you press.</div>

 <section class="big">
  <button class="mark" id="bTrack" type="button" aria-label="This track sounds bad"><span class="ico" aria-hidden="true">✕</span>This track<br>sounds bad</button>
  <button class="mark" id="bTrans" type="button" aria-label="The previous transition was bad"><span class="ico" aria-hidden="true">⇤</span>Previous transition<br>was bad</button>
 </section>

 <details>
  <summary>Marks this visit <span id="cnt">&nbsp;(0)</span></summary>
  <div id="list"></div>
  <div class="foot"><button id="copy" type="button">Copy marks as text</button><button id="restart" type="button">Start the mix from 0:00</button></div>
 </details>
</main>
<div id="flash"><div class="msg" id="flashMsg"></div></div>

<script>
const ENDPOINT = '/files/ratings.php';
const MIX = 'shortlist_mix';
let CUES = [], VARIANT = 'v1';
const au = document.getElementById('au');
const $ = id => document.getElementById(id);
let marks = [];          // this visit only, newest last
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
                set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };
const posKey = () => 'mixmark.pos.' + VARIANT;

function cueAt(t){ let k = 0; for (let i = 0; i < CUES.length; i++) if (t >= CUES[i].start) k = i; return k; }
function fmt(t){ const m = Math.floor(t/60), s = Math.floor(t%60); return m + ':' + String(s).padStart(2,'0'); }
function short(id){ return id.replace(/__cfg\d+__w100/,'').replace(/__st8__d48$/,'').replace(/__d48$/,''); }

function renderNow(){
  if (!CUES.length) return;
  const k = cueAt(au.currentTime || 0), c = CUES[k];
  $('nowT').textContent = c.i + '/' + CUES.length + ' · ' + fmt(au.currentTime || 0);
  $('nowId').textContent = short(c.id);
}
function renderList(){
  $('cnt').textContent = ' (' + marks.length + ')';
  const box = $('list'); box.textContent = '';
  marks.slice().reverse().forEach(m => {
    const r = document.createElement('div'); r.className = 'row';
    const w = document.createElement('div'); w.className = 'w';
    const a = document.createElement('div');
    a.textContent = m.kind === 'track' ? ('Track ' + m.track + ' bad') : ('Transition into ' + m.track + ' bad');
    const s = document.createElement('small'); s.textContent = fmt(m.t) + ' · ' + short(m.id) + (m.saved ? '' : ' · NOT SAVED');
    w.append(a, s);
    const d = document.createElement('button'); d.type = 'button'; d.textContent = '✕'; d.setAttribute('aria-label', 'Remove mark');
    d.onclick = () => removeMark(m);
    r.append(w, d); box.appendChild(r);
  });
}
function flash(color, msg){
  const f = $('flash'); f.style.background = color; $('flashMsg').textContent = msg;
  f.classList.add('on'); clearTimeout(flash.t); flash.t = setTimeout(() => f.classList.remove('on'), 700);
}
function setSt(s, bad){ $('st').textContent = s; $('st').style.color = bad ? 'var(--bad)' : ''; }

async function post(flag, m, tries = 4){
  const body = { type: 'mixflag', source: 'mixtape_mark', mix: MIX, variant: VARIANT, flag, mark: m.key, t: m.t,
                 clip: m.id, clip_idx: m.k, trans_idx: m.kind === 'transition' ? m.k - 1 : -1 };
  for (let i = 0; i < tries; i++){
    try {
      const r = await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), keepalive: true });
      if (r.ok) return true;
      if (r.status !== 429) return false;
    } catch(e){}
    await new Promise(res => setTimeout(res, 500 * (i + 1)));
  }
  return false;
}

async function addMark(kind){
  if (!CUES.length) return;
  const t = au.currentTime || 0, k = cueAt(t), c = CUES[k];
  if (kind === 'transition' && k === 0){ flash('#555', 'No transition yet'); return; }
  const m = { key: Date.now().toString(36) + Math.random().toString(36).slice(2,6), kind, k, track: c.i, id: c.id,
              t: Math.round(t*10)/10, saved: false };
  marks.push(m); renderList();
  if (navigator.vibrate) try { navigator.vibrate(kind === 'track' ? [60] : [40, 60, 40]); } catch(e){}
  flash(kind === 'track' ? '#c62828' : '#b26a00', kind === 'track' ? 'Track ' + c.i + ' marked' : 'Transition into ' + c.i + ' marked');
  m.saved = await post(kind === 'track' ? 'bad_track' : 'bad_transition', m);
  renderList();
  if (!m.saved){ if (navigator.vibrate) try { navigator.vibrate([200, 100, 200, 100, 200]); } catch(e){}
                 setSt('Last mark NOT saved (no connection?). It is in the list below; copy it later.', true); }
  else setSt('Saved ' + marks.filter(x => x.saved).length + ' mark(s) on the server.');
}
async function removeMark(m){
  marks = marks.filter(x => x.key !== m.key); renderList();
  if (m.saved && !(await post('unmark', m))) setSt('Could not record the removal on the server.', true);
}

// keep the screen awake while the page is visible
let wake = null;
async function keepAwake(){
  try { if ('wakeLock' in navigator && document.visibilityState === 'visible' && !wake){ wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch(e){}
}
// position: save every 2 s while playing and whenever the page is hidden; restore on load
let lastSave = 0;
function savePos(force){ const now = Date.now(); if (force || now - lastSave > 2000){ lastSave = now; if (au.currentTime > 1) store.set(posKey(), String(au.currentTime)); } }
au.addEventListener('timeupdate', () => { renderNow(); savePos(false); });
au.addEventListener('seeked', () => { renderNow(); savePos(true); });
au.addEventListener('pause', () => savePos(true));
au.addEventListener('play', keepAwake);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') savePos(true); else keepAwake(); });
window.addEventListener('pagehide', () => savePos(true));

$('bTrack').onclick = () => addMark('track');
$('bTrans').onclick = () => addMark('transition');
$('copy').onclick = async () => {
  const txt = marks.map(m => (m.kind === 'track' ? 'BAD TRACK ' + m.track : 'BAD TRANSITION ' + (m.track-1) + '->' + m.track) + ' @' + fmt(m.t) + ' ' + m.id).join('\n') || 'no marks';
  try { await navigator.clipboard.writeText(txt); setSt('Copied.'); } catch(e){ setSt('Copy blocked by the browser.', true); }
};
$('restart').onclick = () => { au.currentTime = 0; savePos(true); };

(async () => {
  renderList();
  try {
    const r = await fetch('cues.json', { cache: 'no-cache' });
    const j = await r.json();
    CUES = j.cues;
    VARIANT = String(j.variant || ('xfade' + (j.xfade || 0))).replace(/[^A-Za-z0-9._-]/g, '');
    $('sub').textContent = 'Shortlist mix · ' + CUES.length + ' tracks · ' + VARIANT;
    const saved = parseFloat(store.get(posKey()));
    const resume = () => { if (saved > 1 && saved < (au.duration || 1e9) - 5){ au.currentTime = saved; setSt('Resumed at ' + fmt(saved) + '. Press play.'); } renderNow(); };
    if (au.readyState >= 1) resume(); else au.addEventListener('loadedmetadata', resume, { once: true });
    if ('mediaSession' in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({ title: 'Shortlist mix (' + VARIANT + ')', artist: 'aavepyora evals' });
      navigator.mediaSession.setActionHandler('play', () => au.play());
      navigator.mediaSession.setActionHandler('pause', () => au.pause());
    }
    renderNow();
  } catch(e){ $('sub').textContent = 'Could not load the track list'; setSt('Marking is unavailable until the track list loads.', true); }
})();
</script>
</body>
</html>
